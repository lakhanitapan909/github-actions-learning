name: Secret Practice

on:
  push:

jobs:
  secret-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Repository Files
        run: ls -la

      - name: Show File
        run: cat README.md

      - name: Check README
        run: test -f README.md
